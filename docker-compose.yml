name: medcareai2
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medai
      POSTGRES_PASSWORD: medai
      POSTGRES_DB: medcareai2
      TZ: Asia/Taipei
    command: ["postgres", "-c", "timezone=Asia/Taipei"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai -d medcareai2"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
      # Robot device API. Localhost only by default; to let a Reachy Mini on the home network reach it, set
      # DEVICE_BIND in .env to this laptop's LAN IP (never 0.0.0.0 on an untrusted network, never tunnel it).
      - "${DEVICE_BIND:-127.0.0.1}:8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://medai:medai@postgres:5432/medcareai2
      TZ: Asia/Taipei
      FACE_REC_BASE: /models/face_recognition
      EMOTION_MODEL_PATH: /models/emotion_seed43/model_fp32.onnx
      FRONTEND_URL: http://localhost:8000
      INTAKE_V1_COLLECT: "0"
    volumes:
      - ./models/face_recognition/face_gallery:/models/face_recognition/face_gallery
      - ./ledger:/ledger
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Robot-side bridge (Phase 2). Opt-in: docker compose --profile reachy up -d reachy-bridge
  # Talks only to the app's private device port on the compose network; no published ports.
  reachy-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    profiles: ["reachy"]
    env_file: .env
    environment:
      APP_INTERNAL_URL: http://app:8001
      REACHY_ROBOT_HOST: ${REACHY_ROBOT_HOST:-}
      REACHY_DEVICE_TOKEN: ${REACHY_DEVICE_TOKEN:-}
      TZ: Asia/Taipei
    depends_on:
      - app
    restart: unless-stopped

  backup:
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile.backup
    environment:
      PGHOST: postgres
      PGUSER: medai
      PGPASSWORD: medai
      PGDATABASE: medcareai2
      TZ: Asia/Taipei
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./backups:/backups
      - ./models/face_recognition/face_gallery:/gallery:ro
      - ./ledger:/ledger
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
