name: medcareai2
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medai
      POSTGRES_PASSWORD: medai
      POSTGRES_DB: medcareai2
      TZ: Asia/Taipei
    command: ["postgres", "-c", "timezone=Asia/Taipei"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai -d medcareai2"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      # Keep the app's host port clear of the Reachy Mini daemon (8000).
      - "${WEB_PORT:-8080}:8000"
      # Robot device API. Localhost only by default; to let a Reachy Mini on the home network reach it, set
      # DEVICE_BIND in .env to this laptop's LAN IP (never 0.0.0.0 on an untrusted network, never tunnel it).
      - "${DEVICE_BIND:-127.0.0.1}:8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://medai:medai@postgres:5432/medcareai2
      TZ: Asia/Taipei
      FACE_REC_BASE: /models/face_recognition
      EMOTION_MODEL_PATH: /models/emotion_seed43/model_fp32.onnx
      LANDMARK_MODEL_DIR: /models/landmarks
      FRONTEND_URL: ${MEDCARE_FRONTEND_URL:-http://localhost:${WEB_PORT:-8080}}
      INTAKE_V1_COLLECT: "0"
    volumes:
      - ./models/face_recognition/face_gallery:/models/face_recognition/face_gallery
      - ./ledger:/ledger
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # LINE webhook, the app's only public entry point. Opt-in: scripts/line-tunnel.ps1
  # The tunnel reaches only this proxy, and the proxy forwards only POST /api/notify/webhook/line
  # (signed by LINE; the app verifies X-Line-Signature) and GET of dose-video links
  # (/api/media/line/<43-character token>.mp4|.jpg). The rest of the app stays on the LAN.
  line-webhook-proxy:
    image: nginx:1.27-alpine
    profiles: ["line"]
    volumes:
      - ./scripts/line-webhook/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Cloudflare quick tunnel: free, no account, but a new https://*.trycloudflare.com address on every
  # start. scripts/line-tunnel.ps1 reads it and updates the LINE webhook setting.
  line-tunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["line"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://line-webhook-proxy:8080"]
    depends_on:
      - line-webhook-proxy
    restart: unless-stopped

  # Robot-side bridge (Phase 2). Opt-in: docker compose --profile reachy up -d reachy-bridge
  # Talks only to the app's private device port on the compose network; no published ports.
  reachy-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    profiles: ["reachy"]
    env_file: .env
    environment:
      APP_INTERNAL_URL: http://app:8001
      REACHY_ROBOT_HOST: ${REACHY_ROBOT_HOST:-}
      REACHY_DEVICE_TOKEN: ${REACHY_DEVICE_TOKEN:-}
      TZ: Asia/Taipei
    depends_on:
      - app
    restart: unless-stopped

  backup:
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile.backup
    environment:
      PGHOST: postgres
      PGUSER: medai
      PGPASSWORD: medai
      PGDATABASE: medcareai2
      TZ: Asia/Taipei
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./backups:/backups
      - ./models/face_recognition/face_gallery:/gallery:ro
      - ./ledger:/ledger
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
