# All the public tunnel can reach: LINE's webhook, and dose-video links for family. The rest of the app stays private.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 256k;

    location = /api/notify/webhook/line {
        limit_except POST { deny all; }
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Dose videos (app/routers/api_dose_video.py): a family member's LINE app downloads each clip and its preview
    # through a private per-recipient link. Only GET/HEAD of that exact shape; Range is passed through.
    location ~ "^/api/media/line/[A-Za-z0-9_-]{43}\.(mp4|jpg)$" {
        limit_except GET { deny all; }
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
