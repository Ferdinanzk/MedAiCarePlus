<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedAiCarePlus{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{% if user %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/display/"><i class="bi bi-heart-pulse-fill me-2"></i>MedAiCarePlus</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/display/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/emotion/"><i class="bi bi-emoji-smile me-1"></i>Emotion</a></li>
        <li class="nav-item"><a class="nav-link" href="/ocr/"><i class="bi bi-camera me-1"></i>Prescription</a></li>
        <li class="nav-item"><a class="nav-link" href="/medicines/"><i class="bi bi-capsule me-1"></i>Medicines</a></li>
        <li class="nav-item"><a class="nav-link" href="/notifications/"><i class="bi bi-bell me-1"></i>Alerts</a></li>
      </ul>
      <span class="navbar-text me-3 text-white"><i class="bi bi-person-circle me-1"></i>{{ user.name }}</span>
      <a href="/auth/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div>
</nav>
{% endif %}

<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
