{% extends "base.html" %}
{% block title %}Scan Prescription — MedAiCarePlus{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-6">
    <h4 class="text-primary mb-3"><i class="bi bi-camera me-2"></i>Prescription Scanner</h4>

    <div class="card mb-3">
      <div class="card-body">
        <ul class="nav nav-tabs mb-3" id="inputTabs">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#uploadTab">Upload File</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#camTab">Webcam</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="uploadTab">
            <input type="file" id="fileInput" class="form-control mb-2" accept="image/*">
            <img id="preview" class="img-fluid rounded border d-none mb-2" style="max-height:300px">
            <button class="btn btn-primary w-100" id="scanFileBtn" onclick="scanFile()" disabled>
              <i class="bi bi-search me-1"></i>Scan Prescription
            </button>
          </div>
          <div class="tab-pane fade" id="camTab">
            <video id="camVideo" width="320" height="240" autoplay muted playsinline class="rounded border mb-2 w-100"></video>
            <canvas id="camCanvas" class="d-none" width="320" height="240"></canvas>
            <button class="btn btn-primary w-100" onclick="captureAndScan()">
              <i class="bi bi-camera me-1"></i>Capture & Scan
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <h4 class="text-primary mb-3"><i class="bi bi-file-text me-2"></i>Scan Results</h4>
    <div id="scanning" class="text-center text-muted py-4 d-none">
      <div class="spinner-border text-primary mb-2" role="status"></div>
      <div>Analysing prescription… (may take 30–60s)</div>
    </div>
    <div id="resultCard" class="card d-none">
      <div class="card-body">
        <table class="table table-sm table-borderless mb-3">
          <tr><th style="width:40%">Medicine</th><td id="rMedName">—</td></tr>
          <tr><th>Quantity</th><td id="rQty">—</td></tr>
          <tr><th>Per dose</th><td id="rAmount">—</td></tr>
          <tr><th>Total</th><td id="rTotal">—</td></tr>
          <tr><th>Schedule</th><td id="rSchedule">—</td></tr>
          <tr><th>Warning</th><td id="rWarning" class="text-danger">—</td></tr>
        </table>
        <div class="mb-2">
          <label class="form-label small">Total pills prescribed</label>
          <input type="number" id="pillInput" class="form-control form-control-sm" value="0">
        </div>
        <button class="btn btn-success w-100" onclick="saveResult()">
          <i class="bi bi-check-lg me-1"></i>Save to Medicines
        </button>
        <div id="saveMsg" class="mt-2 d-none"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/camera.js"></script>
<script src="/static/js/ocr_upload.js"></script>
{% endblock %}
