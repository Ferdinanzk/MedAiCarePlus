{% extends "base.html" %}
{% block title %}Notifications — MedAiCarePlus{% endblock %}

{% block content %}
<h4 class="text-primary mb-3"><i class="bi bi-bell me-2"></i>Pending Notifications</h4>

<div id="notifList">
  <div class="text-center text-muted py-4">Loading…</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadNotifications() {
  const items = await fetch('/notifications/pending').then(r=>r.json());
  const container = document.getElementById('notifList');
  if (!items.length) {
    container.innerHTML = '<div class="alert alert-success">No pending notifications.</div>';
    return;
  }
  container.innerHTML = items.map(n => `
    <div class="card mb-2" id="notif_${n.intk_id}">
      <div class="card-body d-flex justify-content-between align-items-center py-2">
        <div>
          <strong>${n.med_name}</strong>
          <span class="badge bg-${n.intake_stats==='taken'?'success':n.intake_stats==='skipped'?'secondary':'warning'} ms-2">${n.intake_stats}</span>
          <br><small class="text-muted">${new Date(n.intake_time_stamp).toLocaleString()}</small>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary btn-sm" onclick="lineSend(${n.intk_id})">
            <i class="bi bi-chat-dots me-1"></i>LINE
          </button>
          <button class="btn btn-outline-secondary btn-sm" onclick="dismiss(${n.intk_id})">
            Dismiss
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

async function dismiss(id) {
  await fetch(`/notifications/dismiss/${id}`, {method:'POST'});
  document.getElementById(`notif_${id}`)?.remove();
}

async function lineSend(id) {
  const r = await fetch(`/notifications/line-send/${id}`, {method:'POST'}).then(r=>r.json());
  alert(r.status);
}

loadNotifications();
</script>
{% endblock %}
